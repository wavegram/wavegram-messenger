services:
  - type: web
    name: wavemsg
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      - key: PORT
        value: 10000
      - key: BOT_CODE_URL
        value: http://127.0.0.1:3999/
      - key: BOT_PROFILE_URL
        value: http://127.0.0.1:3999/profile
      - key: BOT_TOKEN
        sync: false
      - key: BOT_ADMINS
        value: ""

  - type: worker
    name: wavemsg-bot
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node bot.js
    envVars:
      - key: BOT_HTTP_PORT
        value: 3999
      - key: BOT_TOKEN
        sync: false
      - key: BOT_ADMINS
        value: ""